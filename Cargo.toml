[package]
name = "tree-sitter-bidhuscript"
description = "This is a parser for BidhuScript"
version = "1.0.0"
authors = ["Arnab Santra <arnabsantra248@gmail.com> (https://github.com/Arnab-cloud) <arnabsantra248@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "bidhuscript"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/therealsoutrikdas/bidhuscrip"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.11"
